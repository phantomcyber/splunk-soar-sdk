name: Commit Hygiene
on:
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install commitlint
        run: npm i -g @commitlint/cli @commitlint/config-conventional
      - name: Commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

  semantic_release_dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install semantic-release dependencies
        run: npm install --global semantic-release @semantic-release/exec @semantic-release/git
      - name: Check out the target branch and merge onto it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          printf '%s\n' \
            "BASE_SHA=$BASE_SHA" \
            "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          git checkout --detach "$BASE_SHA"
          git merge --ff-only "$HEAD_SHA"
      - name: Run Semantic Release as a dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          unset GITHUB_ACTIONS GITHUB_REF GITHUB_EVENT_NAME
          semantic-release --dry-run --no-ci
      - name: Validate changelog fragments
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        run: |
          if [[ -s release_version.txt ]]; then
            python3 .github/utils/changelog.py validate \
              --version "$(cat release_version.txt)" \
              --require-new "$BASE_SHA" "$HEAD_SHA"
          else
            python3 .github/utils/changelog.py validate \
              --forbid-new "$BASE_SHA" "$HEAD_SHA"
          fi
      - name: Comment release notes on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const { commentReleaseNotes } = await import('${{ github.workspace }}/.github/utils/github.js');
            await commentReleaseNotes({github, context, core});
